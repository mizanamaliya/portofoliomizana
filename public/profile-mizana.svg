<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="500" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151B2E"/>
      <stop offset="50%" stop-color="#1E263D"/>
      <stop offset="100%" stop-color="#0E1322"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5F36B"/>
      <stop offset="100%" stop-color="#6378FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6378FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#151B2E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="560" fill="url(#bg)"/>
  <circle cx="250" cy="220" r="180" fill="url(#glow)"/>

  <!-- Geometric Grid & Data Glyphs -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="560"/>
    <line x1="250" y1="0" x2="250" y2="560"/>
    <line x1="450" y1="0" x2="450" y2="560"/>
    <line x1="0" y1="140" x2="500" y2="140"/>
    <line x1="0" y1="280" x2="500" y2="280"/>
    <line x1="0" y1="420" x2="500" y2="420"/>
  </g>

  <!-- Central Editorial Monogram & Portrait Silhouette -->
  <g transform="translate(250, 240)">
    <!-- Halo Ring -->
    <circle r="120" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8 6"/>
    <circle r="100" fill="#151B2E" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
    
    <!-- Stylized Monogram -->
    <text y="-10" font-family="'Space Grotesk', sans-serif" font-size="72" font-weight="bold" fill="#C5F36B" text-anchor="middle" dominant-baseline="middle">
      MA
    </text>
    <text y="50" font-family="'JetBrains Mono', monospace" font-size="14" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" letter-spacing="4">
      MIZANA AMALIYA
    </text>
  </g>

  <!-- Data coordinates badge at bottom -->
  <g transform="translate(250, 480)">
    <rect x="-170" y="-20" width="340" height="40" rx="20" fill="#1E263D" stroke="#C5F36B" stroke-opacity="0.4" stroke-width="1"/>
    <text y="2" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C5F36B" text-anchor="middle" dominant-baseline="middle">
      ⟡ DATA • TECH • RESEARCH ⟡
    </text>
  </g>
</svg>
